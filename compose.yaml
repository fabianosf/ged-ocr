services:
  db:
    image: postgres:16-alpine
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ged_ocr}
      POSTGRES_USER: ${POSTGRES_USER:-ged_ocr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
  backend:
    build: ./backend
    env_file: .env
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 60 --access-logfile /dev/null"
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8000/api/session/', timeout=3).close()"]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  worker:
    build:
      context: ./backend
      target: worker
    env_file: .env
    environment:
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
    command: celery -A config worker --loglevel=WARNING --concurrency=1
    volumes:
      - media_data:/app/media
      - paddle_cache:/root/.paddlex
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping --timeout=5 | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:5173:5173"]
    volumes:
      - static_data:/app/staticfiles:ro
    depends_on:
      backend:
        condition: service_healthy
volumes:
  postgres_data:
  redis_data:
  media_data:
  paddle_cache:
  static_data:
